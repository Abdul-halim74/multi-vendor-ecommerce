<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login | Bazaarly Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body data-page="login">
<main class="login">
  <form id="login">
    <div style="display:flex;align-items:center;gap:.6rem"><svg viewBox="0 0 40 40" aria-hidden="true" width="40" height="40"><rect width="40" height="40" rx="10" fill="#5B3CC4"/><path d="M11 15h18l-2 15a3 3 0 0 1-3 2.6h-8A3 3 0 0 1 13 30z" fill="#fff"/><path d="M15 15v-2a5 5 0 0 1 10 0v2" fill="none" stroke="#fff" stroke-width="2.6"/><circle cx="20" cy="23" r="3" fill="#FF9F1C"/></svg><h1>Bazaarly Admin</h1></div>
    <p class="muted">Sign in to manage orders, vendors and products.</p>
    <label class="field">Email<input type="email" required value="admin@bazaarly.example" autocomplete="username"></label>
    <label class="field">Password<input type="password" required value="demo1234" autocomplete="current-password"></label>
    <button class="btn btn-p" type="submit" style="justify-content:center;padding:.75rem">Sign in</button>
    <p class="muted" style="font-size:.82rem">Demo login — the filled-in details work.</p>
  </form>
</main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
